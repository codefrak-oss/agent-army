# Re-runs the two-approvals check when a review is submitted or dismissed.
# Evaluates nothing itself; see two-approvals.yml for why.
name: two-approvals-recheck

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  recheck-on-review:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run the pull_request check for this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            run=$(gh api "repos/$REPO/actions/workflows/two-approvals.yml/runs?event=pull_request&head_sha=$HEAD&per_page=1" \
                  --jq '.workflow_runs[0] | "\(.id) \(.status)"')
            id=${run%% *}; status=${run##* }
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "no pull_request run for $HEAD yet"; sleep 5; continue; fi
            if [ "$status" = "completed" ]; then
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun" && { echo "re-ran $id"; exit 0; }
            fi
            echo "run $id is $status; waiting"; sleep 5
          done
          echo "could not re-run the check for $HEAD"; exit 1
